document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .inpu ss=\"bd\">\n<span class=\"h\" style=\"font-size:14px;padding-right:4px\">بيانات المدرسة<\u002Fspan>\n<div class=\"card\" style=\"gap:10px\">\n<div class=\"field\"><label>الجهة<\u002Flabel><input class=\"input\" value=\"وزارة التعليم\" readonly=\"\"><\u002Fdiv>\n<div class=\"field\"><label>اسم إدارة التعليم<\u002Flabel><input class=\"input\" placeholder=\"اكتب اسم إدارة التعليم\"><\u002Fdiv>\n<div class=\"field\"><label>اسم المدرسة<\u002Flabel><input class=\"input\" value=\"سلامة الدراج الابتدائية والمتوسطة\" readonly=\"\"><\u002Fdiv>\n<div class=\"field\"><label>اسم مدير المدرسة<\u002Flabel><input class=\"input\" placeholder=\"اكتب اسم مدير المدرسة\"><\u002Fdiv>\n<div class=\"field\"><label>العام الدراسي<\u002Flabel><input class=\"input\" value=\"١٤٤٧هـ — الفصل الدراسي الثاني\" readonly=\"\"><\u002Fdiv>\n<div class=\"field\"><label>حساب المعلم (يحدّد الحصص المتاحة)<\u002Flabel><input class=\"input\" value=\"{{ meName }}\" readonly=\"\"><\u002Fdiv>\n<div class=\"field\"><label>تاريخ اليوم<\u002Flabel><input class=\"input\" value=\"{{ todayLabel }}\" readonly=\"\"><\u002Fdiv>\n<\u002Fdiv>\n<span class=\"h\" style=\"font-size:14px;padding-right:4px\">قسم الاستيراد<\u002Fspan>\n<sc-for list=\"{{ imports }}\" as=\"im\" hint-placeholder-count=\"3\">\n<div class=\"card\" style=\"gap:8px;padding:12px 14px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:13px;font-weight:600\">{{ im.title }}<\u002Fspan><span class=\"{{ im.tagClass }}\">{{ im.status }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:11px;opacity:.7\">{{ im.meta }}<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<button class=\"btn btn-secondary\" style=\"flex:1;padding:9px;font-size:12px\" sc-camel-on-click=\"{{ im.view }}\">عرض<\u002Fbutton>\n<button class=\"btn btn-primary\" style=\"flex:1;padding:9px;font-size:12px\" sc-camel-on-click=\"{{ im.upload }}\">استيراد ملف<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"font-size:10.5px;opacity:.6;text-align:center\">الصيغ المدعومة: Excel ‏(xlsx) · PDF · نور<\u002Fdiv>\n<span class=\"h\" style=\"font-size:14px;padding-right:4px\">النسخ الاحتياطي<\u002Fspan>\n<div class=\"card\" style=\"gap:10px;padding:14px\">\n<div style=\"font-size:11.5px;opacity:.75\">تُحفظ بياناتك تلقائيًا على هذا الجهاز ({{ savedCount }} سجلًا). صدّر نسخة لنقلها إلى جهاز آخر أو للاحتفاظ بها.<\u002Fdiv>\n<button class=\"btn btn-primary btn-block\" style=\"padding:12px;font-size:14px\" sc-camel-on-click=\"{{ doExport }}\">تصدير نسخة (ملف JSON)<\u002Fbutton>\n<label class=\"btn btn-secondary btn-block\" style=\"padding:12px;font-size:14px;cursor:pointer\">استيراد نسخة من ملف\n<input type=\"file\" accept=\"application/json,.json\" style=\"display:none\" sc-camel-on-change=\"{{ doImport }}\">\n<\u002Flabel>\n<button class=\"btn btn-ghost\" style=\"font-size:12px;align-self:center\" sc-camel-on-click=\"{{ doClear }}\">مسح البيانات المحفوظة على هذا الجهاز<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ askOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;background:rgba(46,43,37,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px\">\n<div class=\"card elev-lg\" style=\"width:100%;max-width:440px;gap:12px;padding:18px\">\n<div><div class=\"h\" style=\"font-size:19px\">نوع الغياب<\u002Fdiv><div style=\"font-size:13px;opacity:.7\">{{ askName }}<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<button style=\"padding:15px;border:0;border-radius:22px;background:var(--color-accent-800);color:#fff;font-family:var(--font-heading);font-size:16px;cursor:pointer\" sc-camel-on-click=\"{{ askUnexcused }}\">غياب بدون عذر<\u002Fbutton>\n<button style=\"padding:15px;border:0;border-radius:22px;background:var(--color-neutral-400);color:#2e2b25;font-family:var(--font-heading);font-size:16px;cursor:pointer\" sc-camel-on-click=\"{{ askExcused }}\">غياب بعذر<\u002Fbutton>\n<button class=\"btn btn-secondary\" style=\"padding:11px\" sc-camel-on-click=\"{{ askCancel }}\">إلغاء<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"toast\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<div class=\"tb\">\n<button class=\"tbi {{ homeTab }}\" sc-camel-on-click=\"{{ goHome }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\u002Fpath><path d=\"M9 22V12h6v10\"><\u002Fpath><\u002Fsvg><span>الرئيسية<\u002Fspan><\u002Fbutton>\n<button class=\"tbi {{ classesTab }}\" sc-camel-on-click=\"{{ goClasses }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16v16H4z\"><\u002Fpath><path d=\"M4 10h16M10 4v16\"><\u002Fpath><\u002Fsvg><span>الفصول<\u002Fspan><\u002Fbutton>\n<button class=\"tbi {{ attTab }}\" sc-camel-on-click=\"{{ goAttendance }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg><span>المتابعة<\u002Fspan><\u002Fbutton>\n<button class=\"tbi {{ teachersTab }}\" sc-camel-on-click=\"{{ goTeachers }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2 21a7 7 0 0 1 14 0\"><\u002Fpath><path d=\"M17 5h5M19.5 2.5v5\"><\u002Fpath><\u002Fsvg><span>المعلمون<\u002Fspan><\u002Fbutton>\n<button class=\"tbi {{ repTab }}\" sc-camel-on-click=\"{{ goReports }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M7 15v3M12 10v8M17 6v12\"><\u002Fpath><\u002Fsvg><span>التقارير<\u002Fspan><\u002Fbutton>\n<button class=\"tbi {{ setTab }}\" sc-camel-on-click=\"{{ goSettings }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h16M4 12h16M4 18h16\"><\u002Fpath><circle cx=\"9\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"2\"><\u002Fcircle><circle cx=\"8\" cy=\"18\" r=\"2\"><\u002Fcircle><\u002Fsvg><span>الإعدادات<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst AR = (n) => String(n).replace(/[0-9]/g, (d) => \"٠١٢٣٤٥٦٧٨٩\"[d]);\n// صيغة العدد والمعدود العربية: مفرد، مثنى، جمع قلة (٣-١٠)، تمييز مفرد منصوب (١١+)\nconst PL = (n, forms) => n === 1 ? forms[0] : n === 2 ? forms[1] : (n >= 3 && n <= 10) ? AR(n) + \" \" + forms[2] : AR(n) + \" \" + forms[3];\nconst LESSONS = (n) => PL(n, [\"حصة واحدة\", \"حصتان\", \"حصص\", \"حصة\"]);\nconst CLASSES = (n) => PL(n, [\"فصل واحد\", \"فصلان\", \"فصول\", \"فصلًا\"]);\nconst C = {\n  p: \"background:var(--color-accent-2-500);border-color:var(--color-accent-2-500);color:#fff\",\n  a: \"background:var(--color-accent-800);border-color:var(--color-accent-800);color:#fff\",\n  e: \"background:var(--color-neutral-400);border-color:var(--color-neutral-400);color:#2e2b25\",\n  l: \"background:var(--color-accent-400);border-color:var(--color-accent-400);color:#402310\",\n  off: \"\"\n};\n\nclass Component extends DCLogic {\n  state = { data: null, sched: null, teacher: null, ask: null, me: \"علي مصيخ\", weekOffset: 0, screen: \"home\", classId: \"g5\", period: 3, marks: {}, student: null, from: \"home\", toast: \"\",\n            area: \"absence\", day: Math.min(4, new Date().getDay()), pts: {}, hw: {}, hwId: 0, scores: {}, testId: 0 };\n\n  componentDidMount() {\n    this.loadData();\n    try {\n      const raw = localStorage.getItem(\"tatabu3:v1\");\n      if (raw) this.setState(Object.assign({ toast: \"\" }, JSON.parse(raw)));\n    } catch (e) { /* نسخة تالفة — تُتجاهل */ }\n  }\n  records() {\n    const s = this.state;\n    return { marks: s.marks, pts: s.pts, hw: s.hw, scores: s.scores, me: s.me };\n  }\n  componentDidUpdate() {\n    try { localStorage.setItem(\"tatabu3:v1\", JSON.stringify(this.records())); } catch (e) { /* ممتلئ */ }\n  }\n  exportBackup() {\n    const payload = { app: \"متابعة الطلاب\", version: 1, savedAt: new Date().toISOString(), data: this.records() };\n    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: \"application/json\" }));\n    const a = document.createElement(\"a\");\n    a.href = url;\n    a.download = \"نسخة-متابعة-\" + new Date().toISOString().slice(0, 10) + \".json\";\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 2000);\n    this.flash(\"تم تصدير النسخة\");\n  }\n  importBackup(ev) {\n    const file = ev.target.files && ev.target.files[0];\n    if (!file) return;\n    const rd = new FileReader();\n    rd.onload = () => {\n      try {\n        const p = JSON.parse(rd.result);\n        const dt = p.data || p;\n        this.setState({ marks: dt.marks || {}, pts: dt.pts || {}, hw: dt.hw || {}, scores: dt.scores || {}, me: dt.me || this.state.me });\n        this.flash(\"تم استيراد النسخة\");\n      } catch (e) { this.flash(\"تعذّر قراءة الملف\"); }\n    };\n    rd.readAsText(file);\n    ev.target.value = \"\";\n  }\n  clearLocal() {\n    try { localStorage.removeItem(\"tatabu3:v1\"); } catch (e) { /* لا شيء */ }\n    this.setState({ marks: {}, pts: {}, hw: {}, scores: {} });\n    this.flash(\"مُسحت البيانات المحفوظة على هذا الجهاز\");\n  }\n  loadData(tries) {\n    if (window.DS_classes) {\n      this.setState({\n        data: { classes: window.DS_classes, school: window.DS_school },\n        sched: { days: window.DS_days, classMap: window.DS_classMap, schedule: window.DS_schedule, teachers: window.DS_teachers }\n      });\n      return;\n    }\n    if ((tries || 0) < 40) setTimeout(() => this.loadData((tries || 0) + 1), 100);\n  }\n  // ── التاريخ: الأسبوع الدراسي الأحد–الخميس، بالتقويم الهجري ──\n  weekDates(offset) {\n    const now = new Date();\n    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() + (offset || 0) * 7);\n    const hj = new Intl.DateTimeFormat(\"ar-SA-u-ca-islamic-umalqura\", { day: \"numeric\", month: \"long\", year: \"numeric\" });\n    const hjShort = new Intl.DateTimeFormat(\"ar-SA-u-ca-islamic-umalqura\", { day: \"numeric\", month: \"numeric\" });\n    const names = [\"الأحد\", \"الاثنين\", \"الثلاثاء\", \"الأربعاء\", \"الخميس\"];\n    return [0, 1, 2, 3, 4].map((d) => {\n      const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + d);\n      return {\n        d, dt, wd: names[d],\n        iso: dt.getFullYear() + \"-\" + (dt.getMonth() + 1) + \"-\" + dt.getDate(),\n        full: names[d] + \" \" + hj.format(dt),\n        short: hjShort.format(dt),\n        isToday: dt.toDateString() === new Date().toDateString()\n      };\n    });\n  }\n  dateOf(day) { return this.weekDates(this.state.weekOffset)[day]; }\n  // أول حصة للمعلم المحدد في فصل ويوم معيّنين\n  firstPeriod(me, classId, day) {\n    for (let p = 1; p <= 7; p++) {\n      const l = this.lessonAt(classId, day, p);\n      if (l && l.t === me) return p;\n    }\n    return null;\n  }\n  openLesson(me, classId, day) {\n    const p = this.firstPeriod(me, classId, day);\n    this.setState({ me, classId, day, period: p || 1, screen: \"attendance\", area: \"absence\", weekOffset: 0 });\n    if (!p) this.flash(\"لا توجد حصص لـ \" + me + \" في هذا الفصل هذا اليوم\");\n  }\n  lessonAt(classId, day, period) {\n    const sc = this.state.sched;\n    if (!sc) return null;\n    const name = sc.classMap[classId];\n    const rows = name && sc.schedule[name];\n    return rows ? rows[day][period - 1] : null;\n  }\n\n  cls(id) {\n    const d = this.state.data;\n    if (!d) return null;\n    return d.classes.find((c) => c.id === id) || d.classes[0];\n  }\n  key(i) { return this.state.classId + \":\" + this.dateOf(this.state.day).iso + \":\" + this.state.period + \":\" + i; }\n  set(i, v) {\n    const iso = this.dateOf(this.state.day).iso;\n    this.setState((s) => {\n      const marks = Object.assign({}, s.marks);\n      const k = s.classId + \":\" + iso + \":\" + s.period + \":\" + i;\n      if (marks[k] === v) { delete marks[k]; } else { marks[k] = v; }\n      return { marks };\n    });\n  }\n  // المواظبة مشتقة من سجل الغياب: حالة اليوم = أسوأ حالة مرصودة في حصصه\n  dayStatus(cid, iso, i, fallback) {\n    const m = this.state.marks;\n    const RANK = { p: 0, e: 1, l: 2, a: 3 };\n    let seen = null;\n    for (let p = 1; p <= 7; p++) {\n      const v = m[cid + \":\" + iso + \":\" + p + \":\" + i];\n      if (!v) continue;\n      if (seen === null || RANK[v] > RANK[seen]) seen = v;\n    }\n    return seen || fallback;\n  }\n  setDay(cid, iso, i, v) {\n    this.setState((s) => {\n      const marks = Object.assign({}, s.marks);\n      for (let p = 1; p <= 7; p++) marks[cid + \":\" + iso + \":\" + p + \":\" + i] = v;\n      return { marks };\n    });\n  }\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: \"\" }), 2200);\n  }\n  openStudent(classId, i, from) {\n    this.setState({ screen: \"student\", classId, student: i, from: from || this.state.screen });\n  }\n  // deterministic per-student history so the mock stays stable across renders\n  hash(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 9973; return h; }\n\n  renderVals() {\n    const s = this.state, d = s.data;\n    const cur = this.cls(s.classId);\n    const WEEK = this.weekDates(s.weekOffset);\n    const nav = {\n      goHome: () => this.setState({ screen: \"home\" }),\n      goClasses: () => this.setState({ screen: \"classes\" }),\n      goAttendance: () => this.setState({ screen: \"attendance\" }),\n      goReports: () => this.setState({ screen: \"reports\" }),\n      back: () => this.setState({ screen: s.from || \"classes\" })\n    };\n    const base = {\n      isHome: s.screen === \"home\", isClasses: s.screen === \"classes\",\n      isAttendance: s.screen === \"attendance\", isStudent: s.screen === \"student\",\n      isReports: s.screen === \"reports\", toast: s.toast,\n      isTeachers: s.screen === \"teachers\", isTeacher: s.screen === \"teacher\",\n      isSettings: s.screen === \"settings\", setTab: s.screen === \"settings\" ? \"on\" : \"\",\n      goSettings: () => this.setState({ screen: \"settings\" }),\n      doExport: () => this.exportBackup(),\n      doImport: (e) => this.importBackup(e),\n      doClear: () => this.clearLocal(),\n      askOpen: s.ask !== null && s.ask !== undefined,\n      askName: (s.ask !== null && s.ask !== undefined && cur && cur.students[s.ask]) ? cur.students[s.ask] : \"\",\n      askExcused: () => { const i = s.ask; this.setState({ ask: null }); if (i !== null && i !== undefined) this.set(i, \"e\"); },\n      askUnexcused: () => { const i = s.ask; this.setState({ ask: null }); if (i !== null && i !== undefined) this.set(i, \"a\"); },\n      askCancel: () => this.setState({ ask: null }),\n      savedCount: AR(Object.keys(s.marks).length + Object.keys(s.pts).length + Object.keys(s.hw).length + Object.keys(s.scores).length),\n      goTeachers: () => this.setState({ screen: \"teachers\" }),\n      teachersTab: (s.screen === \"teachers\" || s.screen === \"teacher\") ? \"on\" : \"\",\n      isAbsence: s.area === \"absence\", isPunct: s.area === \"punct\", is .assign({}, st.scores); sc[k] = Math.min(MAX, v + 1); return { scores: sc }; }),\n        dec: () => this.setState((st) => { const sc = Object.assign({}, st.scores); sc[k] = Math.max(0, v - 1); return { scores: sc }; }),\n        open: () => this.openStudent(s.classId, i, \"attendance\")\n      };\n    });\n    const scoreVals = cur.students.map((name, i) => {\n      const k = s.classId + \":t\" + s.testId + \":\" + i;\n      const def = Math.round(MAX * (0.45 + ((this.hash(name) + s.testId * 29) % 23) / 40));\n      return Math.min(MAX, (s.scores[k] === undefined) ? def : s.scores[k]);\n    });\n    const achvAvgPct = Math.round((scoreVals.reduce((a, b) => a + b, 0) / (scoreVals.length * MAX)) * 100);\n\n    const areaRatio = {\n      absence: AR(nP) + \" / \" + AR(cur.students.length),\n      punct: \"المواظبة \" + AR(Math.round(punctRows.reduce((a, r) => a + r.days.filter((d) => d.v === \"p\").length, 0) / (punctRows.length * 5) * 100)) + \"٪\",\n      behavior: \"+\" + AR(behPos) + \" / −\" + AR(behNeg),\n      homework: AR(hwDone) + \" / \" + AR(cur.students.length),\n      achv: AR(achvAvgPct) + \"٪\"\n    }[s.area];\n\n    const out = Object.assign(base, {\n      punctRows, behRows, hwRows, scoreRows, assignments, tests, areaRatio,\n      behPos: AR(behPos), behNeg: AR(behNeg),\n      behAvg: AR(Math.round(behVals.reduce((a, b) => a + b, 0) / behVals.length * 10) / 10).replace(\".\", \"٫\"),\n      hwTitle: HW[s.hwId].t, hwDue: HW[s.hwId].due,\n      hwProgress: \"سلّم \" + AR(hwDone) + \" من \" + AR(cur.students.length) + \" · \" + AR(cur.students.length - hwDone) + \" متبقٍ\",\n      hwBarStyle: \"width:\" + Math.round(hwDone / cur.students.length * 100) + \"%;height:100%;background:var(--color-accent-2-500)\",\n      achvAvg: AR(achvAvgPct) + \"٪\", achvTest: TESTS[s.testId],\n      achvSummary: \"أعلى \" + AR(Math.max.apply(null, scoreVals)) + \" · أدنى \" + AR(Math.min.apply(null, scoreVals)) + \" من \" + AR(MAX) + \" · \" + AR(scoreVals.filter((v) => v < MAX * 0.5).length) + \" دون الإتقان\",\n      ringStyle: \"width:76px;height:76px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--color-accent-2-500) 0 \" + achvAvgPct + \"%, var(--color-neutral-300) \" + achvAvgPct + \"% 100%)\",\n      nowClassName: \"الخامس الابتدائي\",\n      nowClassMeta: \"رياضيات · الحصة الثالثة · \" + AR(this.cls(\"g5\").students.length) + \" طالبًا\",\n      todayPresent: AR(278), todayAbsent: AR(14), todayLate: AR(6),\n      alerts, classList, roster, periods,\n      totalStudentsLabel: myClassIds\n        ? \"فصول أ. \" + s.me + \" · \" + WEEK[s.day].wd + \" \" + WEEK[s.day].short\n        : AR(total) + \" طالبًا · \" + AR(d.classes.length) + \" فصلًا\",\n      curClassName: cur.name,\n      curClassMeta: \"الحصة \" + AR(s.period) + \" · \" + cur.subject + \" · الأحد ٤/٩\",\n      presentRatio: AR(nP) + \" / \" + AR(cur.students.length),\n      countsLabel: \"حاضر \" + AR(nP) + \" · غائب \" + AR(nA) + \" (بعذر \" + AR(nE) + \") · متأخر \" + AR(nL),\n      reportBars: rep, avgLabel: \"المتوسط \" + AR(avg) + \"٪\",\n      reportScope: (myClassIds ? \"فصول أ. \" + s.me + \" · \" + CLASSES(rep.length) : \"جميع الفصول\") + \" · \" + WEEK[0].short + \" — \" + WEEK[4].short,\n      weekRate: AR(avg) + \"٪\", weekAbsent: AR(46), weekLate: AR(19), topAbsent\n    });\n\n    out.imports = [\n      { title: \"أسماء المعلمين\", status: s.sched ? \"مستورد\" : \"غير مستورد\",\n        meta: s.sched ? AR(s.sched.teachers.length) + \" معلمًا — من الجدول العام (xlsx)\" : \"لم يُستورد بعد\",\n        tagClass: s.sched ? \"tag tag-accent-2\" : \"tag tag-accent\",\n        view: () => this.setState({ screen: \"teachers\" }), upload: () => this.flash(\"اختر ملف أسماء المعلمين\") },\n      { title: \"الجدول الدراسي\", status: s.sched ? \"مستورد\" : \"غير مستورد\",\n        meta: s.sched ? CLASSES(Object.keys(s.sched.schedule).length) + \" · ٥ أيام × ٧ حصص\" : \"لم يُستورد بعد\",\n        tagClass: s.sched ? \"tag tag-accent-2\" : \"tag tag-accent\",\n        view: () => this.setState({ screen: \"teachers\" }), upload: () => this.flash(\"اختر ملف الجدول العام\") },\n      { title: \"أسماء الطلاب والفصول\", status: \"مستورد\",\n        meta: AR(total) + \" طالبًا في \" + CLASSES(d.classes.length) + \" — من كشوف المتابعة\",\n        tagClass: \"tag tag-accent-2\",\n        view: () => this.setState({ screen: \"classes\" }), upload: () => this.flash(\"اختر كشوف الطلاب\") }\n    ];\n    if (s.sched) {\n      const SC = s.sched;\n      const short = (n) => n.replace(\"ابتدائي\", \"ب\").replace(\"متوسط\", \"م\");\n      out.teacherList = SC.teachers.map((t) => ({\n        name: t.name,\n        meta: LESSONS(t.lessons.length) + \" · \" + t.subjects.join(\"، \"),\n        classes: CLASSES(t.classes.length),\n        avStyle: s.me === t.name ? \"background:var(--color-accent);color:#fff\" : \"\", initial: t.name.charAt(0),\n        open: () => {\n          const day = Math.min(4, new Date().getDay());\n          const firstCls = t.lessons[0] && Object.keys(SC.classMap).find((k) => SC.classMap[k] === t.lessons[0].cls);\n          this.setState({ screen: \"teacher\", teacher: t.name, me: t.name, day, classId: firstCls || s.classId, period: this.firstPeriod(t.name, firstCls || s.classId, day) || 1 });\n        }\n      }));\n      out.teachersCount = AR(SC.teachers.length) + \" معلمًا · \" + CLASSES(Object.keys(SC.schedule).length) + \" في الجدول\";\n      const lesson = this.lessonAt(s.classId, s.day, s.period);\n      const noSched = !SC.classMap[s.classId];\n      out.lessonLabel = noSched ? \"لا يوجد جدول لهذا الفصل\" : lesson ? SC.days[s.day] + \" · الحصة \" + AR(s.period) + \" — \" + lesson.s + \" مع \" + lesson.t : SC.days[s.day] + \" · الحصة \" + AR(s.period) + \" — لا توجد حصة\";\n      out.curClassMeta = \"الحصة \" + AR(s.period) + \" · \" + SC.days[s.day] + (noSched ? \" · لا يوجد جدول لهذا الفصل\" : lesson ? \" · \" + lesson.s + \" — \" + lesson.t : \" · لا توجد حصة\");\n      // بطاقة «حصتك الآن» مشتقة من جدول المعلم نفسه في يوم اليوم\n      const todayIdx = Math.min(4, new Date().getDay());\n      const mine = SC.teachers.find((t) => t.name === s.me);\n      const next = mine && mine.lessons.filter((l) => l.d === todayIdx).sort((a, b) => a.p - b.p)[0];\n      const nextId = next && Object.keys(SC.classMap).find((k) => SC.classMap[k] === next.cls);\n      if (next && nextId && this.cls(nextId)) {\n        out.nowClassName = this.cls(nextId).name;\n        out.nowClassMeta = next.s + \" · الحصة \" + AR(next.p + 1) + \" · \" + AR(this.cls(nextId).students.length) + \" طالبًا\";\n        out.nowPeriodBadge = AR(next.p + 1);\n        out.startNow = () => this.setState({ screen: \"attendance\", classId: nextId, day: todayIdx, period: next.p + 1, area: \"absence\", weekOffset: 0 });\n      } else {\n        out.nowClassName = \"لا توجد حصة اليوم\";\n        out.nowClassMeta = \"جدولك خالٍ في \" + this.weekDates(0)[todayIdx].wd;\n        out.nowPeriodBadge = \"—\";\n        out.startNow = () => this.setState({ screen: \"teachers\" });\n      }\n      const tt = SC.teachers.find((x) => x.name === s.teacher);\n      if (tt) {\n        out.tName = tt.name;\n        out.tMeta = LESSONS(tt.lessons.length) + \" أسبوعيًا · \" + tt.subjects.join(\"، \");\n        out.tInitial = tt.name.charAt(0);\n        out.loginAsTeacher = () => {\n          const firstCls = tt.lessons[0] && Object.keys(SC.classMap).find((k) => SC.classMap[k] === tt.lessons[0].cls);\n          const day = Math.min(4, new Date().getDay());\n          this.setState({ me: tt.name, screen: \"home\", teacher: tt.name, day, classId: firstCls || s.classId, period: this.firstPeriod(tt.name, firstCls || s.classId, day) || 1 });\n          this.flash(\"تم الدخول بحساب \" + tt.name);\n        };\n        out.tClasses = Object.keys(tt.lessons.reduce((a, l) => { a[l.cls] = 1; return a; }, {})).map((c) => {\n          const n = tt.lessons.filter((l) => l.cls === c).length;\n          const subj = Object.keys(tt.lessons.filter((l) => l.cls === c).reduce((a, l) => { a[l.s] = 1; return a; }, {})).join(\"، \");\n          const id = Object.keys(SC.classMap).find((k) => SC.classMap[k] === c);\n          const firstDay = tt.lessons.filter((l) => l.cls === c).sort((a, b) => a.d - b.d || a.p - b.p)[0];\n          return {\n            name: c, meta: subj + \" · \" + LESSONS(n),\n            open: () => (id ? this.openLesson(tt.name, id, firstDay ? firstDay.d : s.day) : this.flash(\"لا يوجد كشف لهذا الفصل\"))\n          };\n        });\n        out.tGrid = [0, 1, 2, 3, 4].map((dd) => ({\n          day: SC.days[dd],\n          cells: [1, 2, 3, 4, 5, 6, 7].map((p) => {\n            const l = tt.lessons.find((x) => x.d === dd && x.p === p - 1);\n            return {\n              label: l ? short(l.cls) : \"—\",\n              sub: l ? l.s : \"\",\n              style: \"flex:1;min-width:0;border-radius:12px;padding:5px 2px;text-align:center;background:\" + (l ? \"var(--color-accent-2-100)\" : \"var(--color-neutral-200)\")\n            };\n          })\n        }));\n      }\n    }\n    if (s.student !== null && cur.students[s.student]) {\n      const name = cur.students[s.student];\n      const h = this.hash(name);\n      const rate = 78 + (h % 20);\n      out.stuName = name;\n      out.stuInitial = name.charAt(0);\n      out.stuMeta = cur.name + \" · رقم \" + AR(s.student + 1) + \" · الهوية \" + AR(1000000000 + h * 977);\n      out.stuRate = AR(rate) + \"٪\";\n      out.stuAbsent = AR(h % 8);\n      out.stuLate = AR(h % 5);\n      out.stuBars = [0, 1, 2, 3, 4, 5, 6, 7].map((w) => {\n        const v = 44 + ((h + w * 37) % 57);\n        return { style: \"flex:1;height:\" + v + \"%;border-radius:8px;background:\" + (v > 80 ? \"var(--color-accent-2-400)\" : v > 60 ? \"var(--color-accent-400)\" : \"var(--color-accent-700)\") };\n      });\n      out.stuLog = [\n        { mark: \"غ\", title: \"غياب بدون عذر\", meta: \"الأحد ٤/٩ · اليوم كامل\", avStyle: \"background:var(--color-accent-800);color:#fff\" },\n        { mark: \"س\", title: \"مشاركة متميزة في الحصة\", meta: \"الخميس ١/٩ · +٥ نقاط\", avStyle: \"background:var(--color-accent-2-300);color:var(--color-accent-2-900)\" },\n        { mark: \"ت\", title: \"تأخر عن الحصة الأولى\", meta: \"الأربعاء ٣٠/٨ · ١٢ دقيقة\", avStyle: \"background:var(--color-accent-400);color:#402310\" }\n      ];\n    }\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
